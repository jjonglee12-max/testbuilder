name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test approval and publishing workflow
        run: npm test
      - name: Build Windows ZIP
        run: npm run package:win
      - name: Save Windows download
        uses: actions/upload-artifact@v4
        with:
          name: AI-Blog-Studio-Windows
          path: release/*-win.zip
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AI-Blog-Studio-Windows
          path: download
      - name: Publish downloadable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "desktop-v0.1.0-${{ github.run_number }}-${{ github.run_attempt }}" \
            download/*-win.zip \
            --title "AI Blog Studio 0.1.0 · Windows build ${{ github.run_number }}" \
            --notes-file .github/RELEASE_NOTES.md \
            --target "${{ github.sha }}" \
            --prerelease
